AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DynamoLive - one table, Lambda and HTTP API, private S3 with CloudFront OAC
Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, live]
    Default: dev
  AdminKey:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Random stage admin secret; do not commit or put in frontend bundle
  BudgetEmail:
    Type: String
    Default: ''
    Description: Optional email for monthly actual-cost budget notifications
Conditions:
  IsLive: !Equals [!Ref Environment, live]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, '']]
Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-DynamoLive'
      BillingMode: !If [IsLive, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If [IsLive, !Ref 'AWS::NoValue', {ReadCapacityUnits: 5, WriteCapacityUnits: 5}]
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: cv, AttributeType: S}
        - {AttributeName: updatedAt, AttributeType: N}
        - {AttributeName: lb, AttributeType: S}
        - {AttributeName: score, AttributeType: N}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      GlobalSecondaryIndexes:
        - IndexName: ByTime
          KeySchema:
            - {AttributeName: cv, KeyType: HASH}
            - {AttributeName: updatedAt, KeyType: RANGE}
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [x, y, color, by, deleted, expiresAt]
          ProvisionedThroughput: !If [IsLive, !Ref 'AWS::NoValue', {ReadCapacityUnits: 5, WriteCapacityUnits: 5}]
        - IndexName: ByScore
          KeySchema:
            - {AttributeName: lb, KeyType: HASH}
            - {AttributeName: score, KeyType: RANGE}
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [nickname, team, pid, joinedAt, expiresAt, roundId]
          ProvisionedThroughput: !If [IsLive, !Ref 'AWS::NoValue', {ReadCapacityUnits: 5, WriteCapacityUnits: 5}]
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa'
      AutoPublish: true
      FunctionConfig: {Comment: Rewrite only SPA entry points, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (['/', '/play', '/play/', '/stage', '/stage/'].indexOf(request.uri) >= 0) request.uri = '/index.html';
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccess.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionARN
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings: {ThrottlingBurstLimit: 500, ThrottlingRateLimit: 300}
      CorsConfiguration:
        AllowOrigins: !If
          - IsLive
          - [!Sub 'https://${Distribution.DomainName}']
          - [!Sub 'https://${Distribution.DomainName}', 'http://localhost:5173', 'http://127.0.0.1:5173']
        AllowHeaders: [content-type, x-admin-key, x-inspect, x-player-id]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 600
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 5
      Handler: handler.handler
      CodeUri: ../backend/dist/
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          ADMIN_KEY: !Ref AdminKey
          ALLOWED_ORIGINS: !If
            - IsLive
            - !Sub 'https://${Distribution.DomainName}'
            - !Sub 'https://${Distribution.DomainName},http://localhost:5173,http://127.0.0.1:5173'
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:ConditionCheckItem]
              Resource: [!GetAtt Table.Arn, !Sub '${Table.Arn}/index/*']
      Events:
        Api:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/{proxy+}', Method: ANY, PayloadFormatVersion: '2.0'}
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 7
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !If [IsLive, 2, 1], Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
Outputs:
  ApiUrl: {Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'}
  SiteUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
  SiteBucketName: {Value: !Ref SiteBucket}
  DistributionId: {Value: !Ref Distribution}
  TableName: {Value: !Ref Table}
